<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — Saumya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Space+Grotesk:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <header id="nav">
      <nav>
        <a href="index.html#hero" class="nav-logo">Saumya :)</a>
        <ul class="nav-links">
          <li><a href="index.html#work">Work</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="assets/resume.pdf" target="_blank" rel="noopener">Resume</a></li>
          <li><a href="playground.html" class="active">Playground</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="playground">
        <div class="playground-inner">
          <div class="game-frame" id="game-frame">
          <!-- HUD -->
          <div class="game-hud">
            <div class="hud-block">
              <span class="hud-label">Score</span>
              <span class="hud-value" id="hud-score">00</span>
            </div>
            <div class="hud-block">
              <span class="hud-label">Time</span>
              <span class="hud-value" id="hud-time">00:30</span>
            </div>
          </div>

          <!-- Hoop -->
          <div class="game-hoop" id="game-hoop" aria-hidden="true">
            <img src="assets/images/game-hoop.png" alt="" class="game-hoop__img" />
          </div>

          <!-- Ball's shadow, cast on the ground plane (kept separate from the ball itself) -->
          <div class="game-ball-shadow" id="game-ball-shadow" aria-hidden="true"></div>

          <!-- Ball (also acts as launch element, animated via JS) -->
          <div class="game-ball" id="game-ball" aria-hidden="true">
            <img src="assets/images/game-ball.svg" alt="" class="game-ball__img" />
          </div>

          <!-- Keyboard background, matching the hero keyboard illustration -->
          <img src="assets/images/Keyboard.webp" alt="" class="game-keyboard-bg" />


          <!-- Charge meter, anchored near the ball -->
          <div class="charge-meter" id="charge-meter" aria-hidden="true">
            <div class="charge-meter-fill" id="charge-meter-fill"></div>
          </div>

          <!-- Keyboard hint strip -->
          <div class="game-keys">
            <button type="button" class="game-key game-key--space" id="key-space" tabindex="-1">
              <img src="assets/images/game-spacebar-icon.svg" alt="" class="game-key__ball-icon" />
              <span>Press to Shoot</span>
              <img src="assets/images/game-spacebar-icon.svg" alt="" class="game-key__ball-icon" />
            </button>
            <button type="button" class="game-key game-key--escape" id="key-escape" aria-label="Exit game">
              <img src="assets/images/game-escape-icon.svg" alt="" class="game-key__escape-icon" />
            </button>
          </div>

          <!-- Result flash (make / miss) -->
          <div class="result-flash" id="result-flash" aria-live="polite"></div>

          <!-- Streak celebration -->
          <div class="streak-pulse" id="streak-pulse" aria-hidden="true">🔥 3 in a row!</div>

          <!-- Escape confirm modal -->
          <div class="game-modal" id="exit-modal" hidden>
            <div class="game-modal__box">
              <p>Are you sure you want to exit?</p>
              <div class="game-modal__actions">
                <button type="button" class="game-modal__btn game-modal__btn--confirm" id="exit-confirm">Yes, exit</button>
                <button type="button" class="game-modal__btn" id="exit-cancel">Keep playing</button>
              </div>
            </div>
          </div>

          <!-- Game over overlay -->
          <div class="game-modal" id="game-over" hidden>
            <div class="game-modal__box">
              <a href="index.html" class="game-modal__close" aria-label="Close and return to homepage">&#x2715;</a>
              <p class="game-over__score"><span id="final-score">00</span> <span class="game-over__score-label">points</span></p>
              <p class="game-over__title">Cool! Here's the actual point of this site.</p>
              <div class="game-modal__actions game-modal__actions--stacked">
                <a href="index.html#work" class="game-modal__btn game-modal__btn--confirm">See My Work &rarr;</a>
                <button type="button" class="game-modal__btn" id="play-again">Play again</button>
              </div>
            </div>
          </div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/main.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
