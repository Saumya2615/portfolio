  <body class="case-study-page">
    <header id="nav">
      <nav>
        <a href="../../index.html" class="nav-logo">Saumya :)</a>
      </nav>
    </header>
    <main>
      <section class="case-study-images">
      <img src="../../assets/case-studies/aeo/1.webp" alt="Answer Engine Optimization case study image 1" loading="lazy" />
      <!-- Before/after toggle - Figma: AEO-Compilation 336:35177 (old) / 336:35187 (new) -->
      <div class="before-after" data-before-after>
        <div class="before-after__slide">
          <h2 class="before-after__title">Where it lands</h2>
          <div class="before-after__toggle">
            <span class="before-after__label" data-set="old" aria-hidden="true">Old</span>
            <button type="button" class="before-after__switch" role="switch" aria-checked="false" aria-label="Show the new design">
              <span class="before-after__knob"></span>
            </button>
            <span class="before-after__label" data-set="new" aria-hidden="true">New</span>
          </div>
          <div class="before-after__frame">
            <div class="before-after__screen">
              <img class="before-after__img before-after__img--old" src="../../assets/case-studies/aeo/screen-old.webp" alt="Old AEO dashboard: visibility score, brand mentions, a visibility trend chart and competitor tables" loading="lazy" />
              <img class="before-after__img before-after__img--new" src="../../assets/case-studies/aeo/screen-new.webp" alt="Redesigned AEO dashboard: a visibility score of 58, how you're showing up from questions to top pick, and content plays" loading="lazy" />
            </div>
          </div>
          <p class="before-after__caption">Just a sneak peek. Let me walk you through how I got here.</p>
        </div>
      </div>
      </section>
    </main>
